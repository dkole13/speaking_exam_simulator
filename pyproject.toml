[build-system]
requires = ['uv_build==0.13.7']
build-backend = 'uv_build'

[tool.uv]
package = false

[project]
name = 'speaking-exam-simulator'
version = '1.0.0'
description = """This project is aimed at helping the user to prepare for the speaking tasks
                 of international English language exams (specifically TOEFL)."""
authors = [
    { name = 'Anastasiia Seliverstova' },
    { name = 'Daria Oleinik' },
    { name = 'Maria Zakieva' },
]
readme = 'README.md'
requires-python = '>=3.13'
dependencies = [
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ['tests']

[tool.mypy]
strict = true

[tool.ruff]
line-length = 120
target-version = 'py313'
extend-exclude = ['**/tests/**']
force-exclude = true

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = [
    'E',
    'F',
    'W',
    'C90',
    'B',
    'I',
    'D',
    'RUF',
]
ignore = [
    'D100',
    'E501',
    'RUF001', 'RUF002', 'RUF003',
]

[tool.ruff.lint.pydocstyle]
convention = 'pep257'

[tool.black]
line-length = 120

[tool.isort]
profile = 'black'
line_length = 120
